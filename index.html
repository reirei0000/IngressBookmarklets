<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingress Mission Tools</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; background-color: #f0f0f0; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto; }
        h1 { color: #009688; }
        p { line-height: 1.6; color: #333; }
        
        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 20px;
        }

        .bookmarklet-btn {
            display: inline-block;
            background-color: #009688;
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 18px;
            border: 2px solid #00796b;
        }
        .bookmarklet-btn.sort-btn {
            background-color: #1976d2;
            border-color: #115293;
        }
        .bookmarklet-btn:hover { background-color: #00796b; }
        .bookmarklet-btn.sort-btn:hover { background-color: #115293; }

        .note { font-size: 0.9em; color: #666; margin-top: 30px; }
        textarea { width: 100%; height: 100px; margin-top: 10px; font-size: 0.8em; }
        
        /* ボタンをふよふよ動かして「掴めそう」な感じを出す */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .bookmarklet-btn {
            animation: float 2s infinite ease-in-out;
            cursor: grab; /* マウスカーソルを「手」にする */
        }
        .bookmarklet-btn:active {
            cursor: grabbing; /* 掴んだときは「握った手」にする */
            animation: none; /* 掴んでいる間はアニメーション停止 */
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Mission Tools</h1>
    <p>Ingressのミッション作成画面で使える便利ツール群です。<br>（CSP回避・フル埋め込み版）</p>
    
    <p>下のボタンを、ブラウザの<strong>ブックマークバー</strong>に<br>ドラッグ＆ドロップして登録してください。</p>

    <div class="button-group">
        <!-- CSVエクスポート ブックマークレット -->
        <a href="javascript:(function(){let rows=document.querySelectorAll('.mission');if(rows.length===0){alert('ミッションが見つかりません。「My Missions」画面で実行してください。');return;}let missions={};rows.forEach(row=>{let nameEl=row.querySelector('[class*=%22mission-title-%22]');let name=nameEl?nameEl.innerText.trim():%22Unknown%22;let timeEl=row.querySelector('[class*=%22mission-time-%22]');let statusRaw=timeEl?timeEl.innerText.trim():%22%22;let status=statusRaw.split(' ')[0].toUpperCase();let dateInfo=statusRaw.replace(status,'').trim();let typeEl=row.querySelector('.mission-type > span');let type=typeEl?typeEl.innerText.trim():%22-%22;let timeIcon=row.querySelector('.time-icon');let timeVal=timeIcon?timeIcon.nextElementSibling.innerText.trim():%22-%22;let likedIcon=row.querySelector('.liked-icon');let ratingVal=likedIcon?likedIcon.nextElementSibling.innerText.trim():%22-%22;let agentsIcon=row.querySelector('.agents-icon');let completionsStr=agentsIcon?agentsIcon.nextElementSibling.innerText.trim().replace(/,/g,''):%220%22;let completions=parseInt(completionsStr)||0;if(!missions[name]){missions[name]={name,completions,rating:ratingVal,time:timeVal,type,status,date:dateInfo};}else{let prev=missions[name];if(completions>prev.completions){missions[name]={name,completions,rating:ratingVal,time:timeVal,type,status,date:dateInfo};}else if((prev.rating===%22-%22||prev.rating===%22%22)&&ratingVal!==%22-%22&&ratingVal!==%22%22){missions[name]={name,completions,rating:ratingVal,time:timeVal,type,status,date:dateInfo};}}});let csv=%22Mission Name,Completions,Rating,Median Time,Type,Status,Date info\n%22;let count=0;for(let key in missions){let m=missions[key];let safeName=m.name.replace(/%22/g,'%22%22');csv+=`%22${safeName}%22,${m.completions},%22${m.rating}%22,%22${m.time}%22,%22${m.type}%22,%22${m.status}%22,%22${m.date}%22\n`;count++;}if(count===0){alert('データが取得できませんでした。');return;}let bom=new Uint8Array([0xEF,0xBB,0xBF]);let blob=new Blob([bom,csv],{type:'text/csv'});let link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='ingress_missions_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(link);link.click();document.body.removeChild(link);})();" 
           class="bookmarklet-btn" onclick="return false;">
           📥 CSV Export
        </a>

        <!-- ミッション名ソート ブックマークレット（トグル＆常駐ボタン付き） -->
        <a href="javascript:(function(){let btnId='mission-sort-btn-custom';let existingBtn=document.getElementById(btnId);if(existingBtn){existingBtn.click();return;}let isAscending=true;let sortMissions=function(){let c=document.querySelector('.missions-list');if(!c){alert('ミッションが見つかりません。「My Missions」画面で実行してください。');return;}let m=Array.from(c.querySelectorAll('.mission'));if(m.length===0){alert('ソート対象のミッションが見つかりません。');return;}m.sort((a,b)=>{let tA=a.querySelector('[class*=%22mission-title-%22]');let tB=b.querySelector('[class*=%22mission-title-%22]');let nameA=tA?tA.textContent.trim():'';let nameB=tB?tB.textContent.trim():'';let comp=nameA.localeCompare(nameB,'ja');return isAscending?comp:-comp;});m.forEach(x=>c.appendChild(x));let btn=document.getElementById(btnId);if(btn){btn.textContent=isAscending?'ミッション名: 昇順 ▼ (次:降順)':'ミッション名: 降順 ▲ (次:昇順)';}isAscending=!isAscending;};let btn=document.createElement('button');btn.id=btnId;btn.textContent='ミッション名: 昇順 ▼ (次:降順)';btn.style.cssText='position: fixed; top: 15px; right: 15px; z-index: 99999; padding: 10px 16px; background: #00d3bb; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.4); font-family: sans-serif;';btn.onclick=sortMissions;document.body.appendChild(btn);sortMissions();})();" 
           class="bookmarklet-btn sort-btn" onclick="return false;">
            🔄 Sort by Name
        </a>
    </div>

    <div class="note">
        <p>使い方：<br><a href="https://missions.ingress.com/" target="_blank">Ingress Mission Authoring Tool</a> の「My Missions」画面を開き、登録したブックマークをクリックしてください。</p>
    </div>
</div>

</body>
</html>
